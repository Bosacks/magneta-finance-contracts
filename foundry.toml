[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@layerzerolabs/=node_modules/@layerzerolabs/",
  "hardhat/=node_modules/hardhat/",
  "ds-test/=lib/forge-std/lib/ds-test/src/",
  "forge-std/=lib/forge-std/src/"
]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

# Foundry resolves ONE solc per build, and these directories hold forked Uniswap
# sources pinned to =0.5.16 and =0.6.6. Without skipping them, every `forge
# build` / `forge test` / halmos run aborts with "No solc version exists that
# matches", before a single test executes — which is the state this repo was in
# on 2026-07-29, requiring two --skip flags on every command.
#
# They are still compiled and deployed through Hardhat, whose config carries
# per-file 0.6.6 / 0.5.16 overrides. Foundry never needed them: they contain no
# tests and nothing under contracts/ that Foundry builds imports them.
skip = ["contracts/imports/*", "contracts/uniswap/*"]
